spring.application.name=Examora
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/examora}
spring.datasource.username=${DB_USERNAME:examora}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

examora.jwt.secret=${JWT_SECRET:examora-college-project-change-this-secret-in-production}
examora.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
