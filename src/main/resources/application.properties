spring.application.name=Examora
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/examora}
spring.datasource.username=${DB_USERNAME:examora}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# schema.sql uses CREATE TABLE IF NOT EXISTS, so re-running is non-destructive.
# data-demo.sql is loaded only with the "demo" profile. Production should set
# SQL_INIT_MODE=never and must NOT enable the demo profile.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false

# Flyway migrations (baseline). Disabled by default for local dev where spring.sql.init
# already provisions the schema via schema.sql. Enabled in production where
# SQL_INIT_MODE=never and schema evolves through versioned migrations.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

examora.jwt.secret=${JWT_SECRET}
examora.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

examora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ---------- Login rate limiting ----------
examora.login.max-per-ip-email=${LOGIN_MAX_PER_IP_EMAIL:10}
examora.login.max-per-ip=${LOGIN_MAX_PER_IP:60}
examora.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}
# Upper bound on tracked IP/key buckets to protect memory, and how often
# the periodic sweep removes expired buckets.
examora.login.max-buckets=${LOGIN_MAX_BUCKETS:100000}
examora.login.cleanup-interval-ms=${LOGIN_CLEANUP_INTERVAL_MS:60000}

# ---------- Trusted reverse proxy ----------
# Set TRUSTED_PROXY=true ONLY when this app is reached exclusively through a
# reverse proxy that sanitizes X-Forwarded-For. When false (default) the header
# is ignored, so direct clients cannot spoof their rate-limit identity.
# TRUSTED_PROXY_ADDRESSES optionally restricts which direct peers may supply XFF
# (comma-separated IPs); when empty, any peer behind the proxy is trusted.
examora.proxy-trusted=${TRUSTED_PROXY:false}
examora.proxy.trusted-addresses=${TRUSTED_PROXY_ADDRESSES:}

# ---------- Two-factor authentication (TOTP) ----------
examora.two-factor.issuer=${TWO_FACTOR_ISSUER:Examora}
examora.two-factor.digits=${TWO_FACTOR_DIGITS:6}
examora.two-factor.period-seconds=${TWO_FACTOR_PERIOD_SECONDS:30}
examora.two-factor.window=${TWO_FACTOR_WINDOW:1}
examora.two-factor.challenge-ttl-seconds=${TWO_FACTOR_CHALLENGE_TTL_SECONDS:300}
examora.two-factor.recovery-code-count=${TWO_FACTOR_RECOVERY_CODE_COUNT:10}

# ---------- One-time code rate limiting ----------
examora.one-time.max-attempts=${ONE_TIME_MAX_ATTEMPTS:5}
examora.one-time.window-seconds=${ONE_TIME_WINDOW_SECONDS:900}
examora.one-time.max-per-ip=${ONE_TIME_MAX_PER_IP:30}
examora.one-time.max-buckets=${ONE_TIME_MAX_BUCKETS:100000}
examora.one-time.cleanup-interval-ms=${ONE_TIME_CLEANUP_INTERVAL_MS:60000}

# ---------- Admin two-factor mandatory ----------
examora.admin.two-factor.mandatory=${ADMIN_TWO_FACTOR_MANDATORY:true}

# ---------- OAuth login (Google, GitHub) ----------
# Disabled until OAUTH_ENABLED=true and the provider client credentials are set.
examora.oauth.enabled=${OAUTH_ENABLED:false}
examora.oauth.default-role=${OAUTH_DEFAULT_ROLE:STUDENT}
# Base URL of the SPA that receives the callback token (no trailing slash).
examora.oauth.frontend-base=${OAUTH_FRONTEND_BASE:http://localhost:3000}
examora.oauth.state-ttl-seconds=${OAUTH_STATE_TTL_SECONDS:600}
examora.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
examora.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
examora.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
examora.oauth.github.client-id=${GITHUB_CLIENT_ID:}
examora.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
examora.oauth.github.redirect-uri=${GITHUB_REDIRECT_URI:}

# Developer-local .env support. Loaded for every profile EXCEPT "test" so a local
# .env (real OAuth credentials, tokens, etc.) can never influence automated tests.
# Automated tests opt in to the "test" profile via maven-surefire.
#---
spring.config.activate.on-profile=!test
spring.config.import=optional:file:.env[.properties]
