# Production profile — PostgreSQL + Flyway + no destructive SQL init
# Activate with: SPRING_PROFILES_ACTIVE=prod (or set APP_ENV=prod and map to spring profiles)
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# In production, demo profile must never be active; ConfigurationPolicy enforces this at startup.
# SQL_INIT_MODE is forced to "never" regardless of env var — prevents accidental data destruction.
# Override only via explicit configuration if you understand the consequences.

# H2 must never be used in production — driver remains PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Required in production; shared by HTTP CORS and WebSocket handshakes.
# Use comma-separated exact origins, for example https://examora.example.com
examora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
